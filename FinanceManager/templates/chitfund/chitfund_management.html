{% extends "chitfund/base.html" %}

{% block content %}
<div class="mb-8">
    <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white transition-colors">
        ChitFund Management
    </h2>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 transition-colors">
        Choose which chitti you want to manage.
    </p>
</div>

<div class="grid grid-cols-1 gap-6 md:grid-cols-3">
    {% for fund in chit_funds %}
    <section class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm transition-colors hover:border-primary/40 hover:shadow-md dark:border-gray-700 dark:bg-gray-800">
        <div class="flex h-full flex-col">
            <div class="mb-5 inline-flex h-12 w-12 items-center justify-center rounded-lg bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-100">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0119.5 0M3.75 7.5h16.5M5.25 7.5V18m13.5-10.5V18M8.25 10.5h7.5M8.25 13.5h7.5" />
                </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ fund.name }}</h3>
            <p class="mt-2 flex-1 text-sm leading-6 text-gray-500 dark:text-gray-400">{{ fund.description }}</p>
            <div class="mt-6 flex flex-wrap gap-3">
                <a href="{% url 'dashboard' fund.slug %}" class="inline-flex items-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary-hover">
                    Dashboard
                </a>
                <a href="{% url 'client-list' fund.slug %}" class="inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition-colors hover:bg-gray-50 dark:bg-gray-700 dark:text-gray-100 dark:ring-gray-600 dark:hover:bg-gray-600">
                    Clients
                </a>
            </div>
        </div>
    </section>
    {% endfor %}
</div>
{% endblock %}
